<!doctype html>
<html>
    <head>
        <meta charset='utf-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <title>Sign Up</title>
        {% load static %}
        <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css' rel='stylesheet'>
        <script type='text/javascript' src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js'></script>
        <link rel="stylesheet" href="{% static 'css/signup.css' %}">
    </head>
    <body className='snippet-body'>
        <div class="container"> 
            <div class="card"> 
                <div class="row g-0">
                    <div class="col-md-6"> 
                        <div class="h-100 d-flex justify-content-center align-items-center"> 
                            <form method="POST">
                                {% csrf_token %}
                                <div class="py-4 px-3"> 
                                    <h4>Signup</h4>
                                    <div class="row g-2 mt-1"> 
                                        <div class="col-md-6"> 
                                            <div class="input-field"> 
                                                <input class="form-control" id="input1" name="first_name" required> 
                                                <label for="input1">First Name</label> 
                                            </div> 
                                        </div> 
                                        <div class="col-md-6"> 
                                            <div class="input-field"> 
                                                <input class="form-control" id="input2" name="last_name" required> 
                                                <label for="input2">Last Name</label> 
                                            </div> 
                                        </div> 
                                </div> 
                                <div class="row mt-2"> 
                                    <div class="col-md-12"> 
                                        <div class="input-field"> 
                                            <input class="form-control" id="input3" name="username" required> 
                                            <label for="input3">Username</label> 
                                        </div> 
                                    </div> 
                                </div> 
                                <div class="row mt-2"> 
                                    <div class="col-md-12"> 
                                        <div class="input-field"> 
                                            <input class="form-control" id="input4" name="email" type="email" required> 
                                            <label for="input3">Email</label> 
                                        </div> 
                                    </div> 
                                </div> 
                                <div class="row mt-2"> 
                                    <div class="col-md-12"> 
                                        <div class="input-field"> 
                                            <input class="form-control" id="input5" name="phone" required> 
                                            <label for="input3">No Telpon</label> 
                                        </div> 
                                    </div> 
                                </div> 
                                <div class="row mt-2 mb-2"> 
                                    <div class="col-md-12"> 
                                        <div class="input-field"> 
                                            <input class="form-control" id="input6" name="password" type="password" required> 
                                            <label for="input4">Password</label> 
                                        </div> 
                                    </div> 
                                </div> 
                                <span class="">
                                    {% if messages %}
                                        <div class="nfa">
                                            {% for message in messages %}
                                                <h6>{{ message }}</h6>
                                            {% endfor %}
                                        </div>
                                    {% endif %}
                                </span> 
                                <div class="row mt-2"> 
                                    <div class="col-md-12"> 
                                        <button class="btn btn-primary w-100 signup-button" type="submit">Signup</button> 
                                    </div> 
                                </div> 
                                <div class="member mt-1"> 
                                    <span>Already a member?</span> 
                                    <a class="text-decoration-none" href="{% url 'login' %}">Signin</a> 
                                </div> 
                            </form>
                        </div> 
                    </div> 
                </div> 
                    <div class="col-md-6"> 
                        <div class="right-side-content"> 
                            <div class="content d-flex flex-column"> 
                                <h5>Explore your journey</h5> 
                            </div>
                            <div class="right-side"> 
                                <span></span> 
                                <span></span> 
                                <span></span> 
                                <span></span> 
                                <span>
                                    <img src="{% static 'images/signup1.jpg' %}">
                                </span> 
                                <span></span> 
                                <span></span> 
                                <span></span> 
                                <span>
                                    <img src="{% static 'images/signup2.jpg' %}">
                                </span> 
                                <span></span> 
                            </div> 
                        </div> 
                    </div> 
                </div> 
            </div> 
            <div class="parallelogram"> 
                <span></span> 
                <span></span> 
                <span></span> 
            </div>
        </div>
        <script type='text/javascript' src='https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js'></script>
        <script type='text/javascript' src='#'></script>
        <script type='text/javascript' src='#'></script>
        <script type='text/javascript' src='#'></script>
        <script type='text/javascript'>#</script>
        <script type='text/javascript'>var myLink = document.querySelector('a[href="#"]');myLink.addEventListener('click', function(e) {e.preventDefault();});</script>                    
    </body>
</html>
